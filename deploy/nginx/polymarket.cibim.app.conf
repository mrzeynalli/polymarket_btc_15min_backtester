server {
    listen 80;
    listen [::]:80;
    server_name polymarket.cibim.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name polymarket.cibim.app;

    ssl_certificate     /etc/letsencrypt/live/polymarket.cibim.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polymarket.cibim.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:PolymarketSSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/polymarket.cibim.app.access.log;
    error_log  /var/log/nginx/polymarket.cibim.app.error.log;
    client_max_body_size 32k;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 768;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:9110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:9110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
